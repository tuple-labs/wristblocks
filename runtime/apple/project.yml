# Generated into an Xcode project on the build machine. APP_NAME and APP_ID come from tools/validate.py.
name: WristBlocks
options:
  bundleIdPrefix: org.tuplelabs.wristblocks
  deploymentTarget:
    watchOS: "10.0"
targets:
  WristApp:
    type: application
    platform: watchOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ${APP_NAME}
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_NAME: WristApp
        PRODUCT_BUNDLE_IDENTIFIER: org.tuplelabs.wristblocks.${APP_ID}
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
