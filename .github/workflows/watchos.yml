name: Build Apple Watch app

# Proves the core idea: a real watchOS app built on GitHub's macOS machines, no Mac or Xcode needed locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watchos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          echo "watchOS SDK: $(xcrun --sdk watchos --show-sdk-version)"

      - name: Generate Xcode project
        working-directory: apple
        run: |
          brew install xcodegen
          xcodegen generate

      # Unsigned on purpose: signing happens later on the user's own machine, so no Apple credentials ever touch CI.
      - name: Build for Apple Watch (device)
        working-directory: apple
        run: |
          xcodebuild -project WristBlocks.xcodeproj -scheme Tally \
            -configuration Release -sdk watchos -destination 'generic/platform=watchOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Build for watch simulator
        working-directory: apple
        run: |
          xcodebuild -project WristBlocks.xcodeproj -scheme Tally \
            -configuration Debug -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Package
        working-directory: apple/build/Build/Products
        run: |
          ditto -c -k --keepParent Release-watchos/Tally.app "$GITHUB_WORKSPACE/Tally-watchos-unsigned.zip"
          ls -la "$GITHUB_WORKSPACE"/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Tally-watchos-unsigned
          path: Tally-watchos-unsigned.zip
          retention-days: 14
