name: Publish editor

# The blocks editor is a single static page, served free on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["editor/**", ".github/workflows/editor.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: editor }
      - id: deploy
        uses: actions/deploy-pages@v4
