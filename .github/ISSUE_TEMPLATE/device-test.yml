name: Device test
description: Report how a WristBlocks app ran on a real watch
title: "[Device test] <watch model> <app>"
labels: ["device-test"]
body:
  - type: markdown
    attributes:
      value: "Thanks for testing! Please don't include Apple IDs, emails, phone numbers or serial numbers."
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Apple Watch, Wear OS]
    validations: { required: true }
  - type: input
    id: model
    attributes:
      label: Watch model and OS version
      placeholder: "Apple Watch Series 9, watchOS 26.1"
    validations: { required: true }
  - type: input
    id: app
    attributes:
      label: App file
      placeholder: "apps/tally.json"
    validations: { required: true }
  - type: dropdown
    id: route
    attributes:
      label: How you installed it
      options: [Xcode on a Mac, xtool (no Mac), adb, Docker box, Simulator only]
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: What worked
      options:
        - label: App installs and opens
        - label: Counter / timer buttons work
        - label: Count survives closing the app
        - label: Double tap / double pinch triggers the marked block
        - label: Timer buzzes at the end
  - type: textarea
    id: notes
    attributes:
      label: What went wrong or looked off
      description: Steps, errors, screenshots or photos are all welcome.
