# Xcode project is generated on the build machine (xcodegen), so no .xcodeproj lives in the repo.
name: WristBlocks
options:
  bundleIdPrefix: org.tuplelabs.wristblocks
  deploymentTarget:
    watchOS: "10.0"
targets:
  Tally:
    type: application
    platform: watchOS
    sources: [Tally]
    info:
      path: Tally/Info.plist
      properties:
        CFBundleDisplayName: Tally
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        WKApplication: true
        WKWatchOnly: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tuplelabs.wristblocks.tally
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
